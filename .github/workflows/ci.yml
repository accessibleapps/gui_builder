name: Offline tests and documentation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and package (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            pytest: "8.3.5"
          - python: "3.14"
            pytest: "9.1.1"
    env:
      PYTHON_VERSION: ${{ matrix.python }}
      PYTEST_VERSION: ${{ matrix.pytest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install package and compatible test runner
        run: |
          uv venv --python "$PYTHON_VERSION"
          uv pip install --only-binary wxPython . "pytest==$PYTEST_VERSION"
      - name: Import actual wxPython and GUI Builder
        run: uv run --no-project --no-sync python -c "import wx; from gui_builder import fields, forms; print(wx.version())"
      - name: Run complete tracked unit suite
        run: uv run --no-project --no-sync python -m pytest -q
      - name: Build wheel and source distribution
        run: |
          uv build
          test -s dist/gui_builder-1.7.0-py3-none-any.whl
          test -s dist/gui_builder-1.7.0.tar.gz

  docs:
    name: Documentation (Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Install actual autodoc dependencies
        run: |
          uv venv --python 3.11
          uv pip install --only-binary wxPython . -r docs/requirements.txt "sphinx==8.1.3" "sphinx-rtd-theme==3.1.0" "sphinx-autodoc-typehints==3.0.0"
      - name: Build real HTML documentation with warnings fatal
        working-directory: docs
        run: ../.venv/Scripts/python.exe -m sphinx -W --keep-going -b html . _build/html
